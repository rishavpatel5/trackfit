services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gvtrainer
    ports:
      - "5432:5432"
    volumes:
      - gvtrainer_pg:/var/lib/postgresql/data

volumes:
  gvtrainer_pg:
